name: Synchronisation des barèmes

on:
  schedule:
    - cron: '0 6 * * *'      # chaque jour à 06:00 UTC
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copier les nouveaux barèmes du Ministère
        run: python scripts/sync.py
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun nouveau barème."
          else
            git commit -m "Barèmes : synchronisation automatique $(date -u +%F)"
            git push
          fi
