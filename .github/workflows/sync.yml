name: Synchronisation des barèmes

# Le site du Ministère refuse les connexions des serveurs GitHub (hors Maroc) :
# la synchronisation est faite depuis un PC au Maroc (scripts/sync.py + git push).
# Ce workflow reste disponible en lancement manuel, au cas où l'accès serait rétabli.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copier les nouveaux barèmes du Ministère
        run: python scripts/sync.py
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun nouveau barème."
          else
            git commit -m "Barèmes : synchronisation automatique $(date -u +%F)"
            git push
          fi
